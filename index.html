                  Incorrect password. Please try again.

                <input id="pw" type="password" placeholder="Enter preview password"
                  style="width:100%;box-sizing:border-box;padding:14px 16px;background:#f8faff;border:1px solid #bfdbfe;border-radius:12px;color:#1e3a5f;font-size:15px;outline:none;margin-bottom:12px;"

                  onfocus="this.style.borderColor='#2563eb';this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.1)'"
                  onblur="this.style.borderColor='#bfdbfe';this.style.boxShadow='none'" />

                  Shared by your agency · Confidential
                </p>
              </div>
            </div>`;
          document.getElementById("pw").focus();

      }

      window._checkPass = function() {
        const input = document.getElementById("pw").value;
        if (input === PASS) {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify({ exp: Date.now() + EXPIRY_HOURS * 3600000 }));

        } else {
          document.getElementById("err").style.display = "block";
          document.getElementById("pw").value = "";
          document.getElementById("pw").focus();
        }
      };

        document.addEventListener("DOMContentLoaded", function() {
          // Remove root content if it somehow rendered
          var root = document.getElementById("root");
          if (root) root.innerHTML = "";
        });

          var scripts = document.querySelectorAll('script[type="text/babel"]');
          scripts.forEach(function(s) { s.type = "text/plain"; });
        }, true);
        throw new Error("AUTH_REQUIRED");
      }
    })();

// ── REAL DATA: PM2.5 → AQI (EPA standard formula) ───────────────────────────
function pm25ToAQI(pm25) {
  const bp = [
    [0,     12.0,  0,   50 ],
    [12.1,  35.4,  51,  100],
    [35.5,  55.4,  101, 150],
    [55.5,  150.4, 151, 200],
    [150.5, 250.4, 201, 300],
    [250.5, 500.4, 301, 500],
  ];
  const b = bp.find(([lo, hi]) => pm25 >= lo && pm25 <= hi) || bp[bp.length - 1];
  return Math.round(((b[3] - b[2]) / (b[1] - b[0])) * (pm25 - b[0]) + b[2]);
}

// Fetch latest Berlin readings from OpenAQ v2 (CORS-enabled, no key needed)
async function fetchOpenAQ() {
  const res = await fetch(
    'https://api.openaq.org/v2/latest?city=Berlin&country=DE&limit=30',
    { headers: { 'Accept': 'application/json' } }
  );
  if (!res.ok) throw new Error('OpenAQ HTTP ' + res.status);
  return res.json();
}

// Parse OpenAQ response → { aqi, pm25, pm10, no2, o3, co, stationCount, updatedAt }
function parseOpenAQ(data) {
  const results = data.results || [];
  const avg = param => {
    const vals = results
      .flatMap(r => (r.measurements || []).filter(m => m.parameter === param))
      .map(m => m.value)
      .filter(v => v > 0 && v < 9999);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  const pm25 = avg('pm25');
  if (pm25 === null) return null;
  const latest = results
    .flatMap(r => r.measurements || [])
    .map(m => new Date(m.lastUpdated))
    .filter(Boolean)
    .sort((a, b) => b - a)[0];
  return {
    aqi:          pm25ToAQI(pm25),
    pm25:         Math.round(pm25 * 10) / 10,
    pm10:         Math.round((avg('pm10') || pm25 * 1.5) * 10) / 10,
    no2:          Math.round(avg('no2')  || 25),
    o3:           Math.round(avg('o3')   || 38),
    co:           Math.round((avg('co')  || 1.2) * 10) / 10,
    stationCount: results.length,
    updatedAt:    latest || new Date(),
  };
}

function getProfileRecs(profile, aqi) {
  const recs = RECOMMENDATIONS[profile];
  if (aqi <= 50)  return recs.good;
  if (aqi <= 100) return recs.moderate;
  if (aqi <= 150) return recs.sensitive;
  if (aqi <= 200) return recs.unhealthy;
  if (aqi <= 300) return recs.vunhealthy;

}

function matchDistrictName(raw) {
  if (!raw) return null;
  const norm = s => s.toLowerCase().replace(/[-\s]/g,'').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ä/g,'a').replace(/ß/g,'ss');
  const nr = norm(raw);
  return DISTRICT_KEYS.find(k => norm(k) === nr || nr.includes(norm(k)) || norm(k).includes(nr)) || null;
}

// ── SIMULATE DATA ────────────────────────────────────────────────────────────
function simulatePollutants(aqi) {
  const factor = aqi / 150;
  return {
    pm25: Math.round(aqi * 0.6 + Math.random() * 8),
    pm10: Math.round(aqi * 0.9 + Math.random() * 12),
    no2:  Math.round(20 + factor * 80 + Math.random() * 15),
    o3:   Math.round(30 + factor * 60 + Math.random() * 10),
    co:   parseFloat((1.2 + factor * 6 + Math.random() * 0.8).toFixed(1)),
  };
}

function generateForecast(baseAqi) {
  const hours = [];
  const now = new Date();
  let current = baseAqi;
  for (let i = 0; i < 6; i++) {
    const h = new Date(now.getTime() + i * 3600000);
    const delta = (Math.random() - 0.45) * 30;
    current = Math.max(10, Math.min(400, current + delta));
    hours.push({ hour: h.getHours(), aqi: Math.round(current) });
  }
  return hours;
}

// ── GAUGE COMPONENT ─────────────────────────────────────────────────────────
function AQIGauge({ aqi, level }) {
  const radius = 80;
  const stroke = 12;
  const norm   = radius - stroke / 2;
  const circ   = Math.PI * norm; // half circle
  const pct    = Math.min(aqi / 500, 1);
  const offset = circ * (1 - pct);

  const gradId = "aqiGrad";

  return (
    <div className="relative flex items-center justify-center" style={{ width: 200, height: 120 }}>
      <svg width="200" height="120" viewBox="0 0 200 120">
        <defs>
          <linearGradient id={gradId} x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stopColor="#22c55e" />
            <stop offset="30%"  stopColor="#eab308" />
            <stop offset="55%"  stopColor="#f97316" />
            <stop offset="75%"  stopColor="#ef4444" />
            <stop offset="90%"  stopColor="#a855f7" />
            <stop offset="100%" stopColor="#be123c" />
          </linearGradient>
        </defs>
        {/* Track */}
        <path
          d={`M ${stroke/2} 100 A ${norm} ${norm} 0 0 1 ${200-stroke/2} 100`}
          fill="none" stroke="#dbeafe" strokeWidth={stroke} strokeLinecap="round"
        />
        {/* Fill */}
        <path
          d={`M ${stroke/2} 100 A ${norm} ${norm} 0 0 1 ${200-stroke/2} 100`}
          fill="none" stroke={`url(#${gradId})`} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={circ} strokeDashoffset={offset}
          style={{ transition: "stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1)" }}
        />
        {/* Needle dot */}
        {(() => {
          const angle = Math.PI * pct;
          const cx = 100 - norm * Math.cos(angle);
          const cy = 100 - norm * Math.sin(angle);
          return (
            <circle cx={cx} cy={cy} r={7} fill={level.color}
              style={{ filter: `drop-shadow(0 0 8px ${level.color})`, transition: "all 1.2s cubic-bezier(0.4,0,0.2,1)" }} />
          );
        })()}
      </svg>
      {/* Center label */}
      <div className="absolute bottom-0 left-0 right-0 flex flex-col items-center" style={{ bottom: 4 }}>
        <span className="text-5xl font-black" style={{ color: level.color, textShadow: `0 0 30px ${level.glow}`, transition: "color 0.8s ease" }}>
          {aqi}
        </span>
        <span className="text-xs font-medium" style={{ color: "#93c5fd" }}>AQI</span>
      </div>
    </div>
  );
}

// ── HISTORY CHART COMPONENT ──────────────────────────────────────────────────
const RANGES = [
  { id: "24h", label: "24 Hours",  points: 24, stepHours: 1  },
  { id: "7d",  label: "7 Days",    points: 28, stepHours: 6  },
  { id: "30d", label: "30 Days",   points: 30, stepHours: 24 },
  { id: "3m",  label: "3 Months",  points: 90, stepHours: 24 },
];

const METRICS = [
  { id: "aqi",  label: "AQI",   unit: "",       color: "#3b82f6", factor: v => v },
  { id: "pm25", label: "PM₂.₅", unit: "µg/m³", color: "#f97316", factor: v => Math.round(v * 0.62) },
  { id: "pm10", label: "PM₁₀",  unit: "µg/m³", color: "#a855f7", factor: v => Math.round(v * 0.93) },
  { id: "no2",  label: "NO₂",   unit: "ppb",   color: "#ef4444", factor: v => Math.round(15 + v * 0.5) },
  { id: "o3",   label: "O₃",    unit: "ppb",   color: "#16a34a", factor: v => Math.round(28 + v * 0.38) },
  { id: "co",   label: "CO",    unit: "ppm",   color: "#64748b", factor: v => parseFloat((0.8 + v * 0.04).toFixed(1)) },
];

function generateHistory(baseAqi, rangeId) {
  const r = RANGES.find(x => x.id === rangeId);
  const now = new Date();
  const labels = [], aqiVals = [];
  let cur = baseAqi;

  for (let i = r.points - 1; i >= 0; i--) {
    const t = new Date(now.getTime() - i * r.stepHours * 3600000);
    // Realistic daily cycle: worse in morning rush & evening
    const h = t.getHours();
    const cycle = Math.sin((h - 7) * Math.PI / 10) * 12 + Math.sin((h - 18) * Math.PI / 6) * 8;
    // Slow random walk
    cur = Math.max(8, Math.min(310, cur + (Math.random() - 0.46) * 14 + cycle * 0.2));
    aqiVals.push(Math.round(cur));

    if (rangeId === "24h") {
      labels.push(t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
    } else if (rangeId === "7d") {
      labels.push(t.toLocaleDateString([], { weekday: "short" }) + " " +
                  t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
    } else {
      labels.push(t.toLocaleDateString([], { month: "short", day: "numeric" }));
    }
  }
  return { labels, aqiVals };
}

// ── BERLIN MAP COMPONENT ─────────────────────────────────────────────────────
function BerlinMap({ globalAqi, dataStatus }) {
  const mapContainerRef = useRef(null);
  const mapRef          = useRef(null);
  const layersRef       = useRef({});
  const selectedRef     = useRef(null);
  const districtAqiRef  = useRef({});
  const selectFnRef     = useRef(null);

  const [selectedDistrict, setSelectedDistrict] = useState(null);
  const [postalInput,      setPostalInput]       = useState("");
  const [suggestions,      setSuggestions]       = useState([]);
  const [showSuggestions,  setShowSuggestions]   = useState(false);
  const [mapLoaded,        setMapLoaded]         = useState(false);
  const [mapError,         setMapError]          = useState(false);

  // Generate per-district AQI values once, seeded from globalAqi
  const [districtAqis] = useState(() => {
    const aqis = {};
    DISTRICT_KEYS.forEach(name => {
      const v = Math.round((Math.random() - 0.5) * 55);
      aqis[name] = Math.max(10, Math.min(320, globalAqi + v));
    });
    districtAqiRef.current = aqis;
    return aqis;
  });

  // Helper: reset a layer to its normal style
  function resetStyle(name) {
    const lyr = layersRef.current[name];
    if (!lyr) return;
    const lvl = getAQILevel(districtAqiRef.current[name] || globalAqi);
    lyr.setStyle({ fillColor: lvl.color, fillOpacity: 0.5, weight: 2, color: '#fff' });
  }

  // Select a district on the map
  function selectDistrict(name) {
    if (selectedRef.current && selectedRef.current !== name) resetStyle(selectedRef.current);
    selectedRef.current = name;
    setSelectedDistrict(name);
    const lyr = layersRef.current[name];
    if (lyr) {
      lyr.setStyle({ fillOpacity: 0.85, weight: 3, color: '#1e40af' });
      try { mapRef.current.fitBounds(lyr.getBounds(), { padding: [40, 40], maxZoom: 12 }); } catch(e){}
    }
  }
  selectFnRef.current = selectDistrict;

  // Clear selection
  function clearSelection() {
    if (selectedRef.current) resetStyle(selectedRef.current);
    selectedRef.current = null;
    setSelectedDistrict(null);
    setPostalInput("");
    setSuggestions([]);
    if (mapRef.current) mapRef.current.setView([52.52, 13.405], 10);
  }

  // Initialise Leaflet map once
  useEffect(() => {
    if (!mapContainerRef.current || mapRef.current) return;
    const L = window.L;
    if (!L) { setMapError(true); return; }

    const map = L.map(mapContainerRef.current, {
      center: [52.52, 13.405], zoom: 10, zoomControl: true,
    });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://openstreetmap.org">OSM</a> &copy; <a href="https://carto.com">CARTO</a>',
      subdomains: 'abcd', maxZoom: 16,
    }).addTo(map);
    mapRef.current = map;

    function renderGeoJSON(geojson) {
      L.geoJSON(geojson, {
        style: f => {
          const raw  = f.properties.spatial_name || f.properties.Bezirksname || f.properties.Bezirk ||
                       f.properties.name || f.properties.NAME || f.properties.bezirk || "";
          const name = matchDistrictName(raw) || raw;
          const lvl  = getAQILevel(districtAqiRef.current[name] || globalAqi);
          return { fillColor: lvl.color, fillOpacity: 0.5, color: '#fff', weight: 2, opacity: 1 };
        },
        onEachFeature: (f, lyr) => {
          const raw  = f.properties.spatial_name || f.properties.Bezirksname || f.properties.Bezirk ||
                       f.properties.name || f.properties.NAME || f.properties.bezirk || "";
          const name = matchDistrictName(raw) || raw;
          const dAqi = districtAqiRef.current[name] || globalAqi;
          const lvl  = getAQILevel(dAqi);
          layersRef.current[name] = lyr;

          lyr.on({
            mouseover: e => { if (selectedRef.current !== name) e.target.setStyle({ fillOpacity: 0.72, weight: 2.5 }); },
            mouseout:  e => { if (selectedRef.current !== name) e.target.setStyle({ fillOpacity: 0.5,  weight: 2 }); },
            click:     () => selectFnRef.current(name),
          });

          lyr.bindTooltip(
            `<div style="font:700 13px Inter,sans-serif;color:#1e3a5f;margin-bottom:3px">${name}</div>` +
            `<div style="font:800 17px Inter,sans-serif;color:${lvl.color}">${dAqi} <span style="font:600 12px Inter,sans-serif;color:#64748b">${lvl.label}</span></div>`,
            { sticky: true, opacity: 1 }
          );
        }
      }).addTo(map);
      setMapLoaded(true);
    }

    // Try multiple public GeoJSON sources
    const sources = [
      'https://raw.githubusercontent.com/funkeinteraktiv/Berlin-Geodaten/master/berlin_bezirke.geojson',
      'https://tsb-opendata.s3.eu-central-1.amazonaws.com/bezirksgrenzen/bezirksgrenzen.geojson',
    ];
    let idx = 0;
    function tryNext() {
      if (idx >= sources.length) { setMapError(true); return; }
      fetch(sources[idx++])
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(renderGeoJSON)
        .catch(tryNext);
    }
    tryNext();

    return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
  }, []);

  // Postal code input handler
  function handlePostalChange(val) {
    setPostalInput(val);
    if (val.length >= 2) {
      const matches = Object.keys(POSTAL_TO_DISTRICT).filter(pc => pc.startsWith(val)).slice(0, 8);
      setSuggestions(matches);
      setShowSuggestions(true);
    } else {
      setSuggestions([]);
    }
    if (val.length === 5 && POSTAL_TO_DISTRICT[val]) {
      selectDistrict(POSTAL_TO_DISTRICT[val]);
      setSuggestions([]);
      setShowSuggestions(false);
    }
  }

  function pickPostal(pc) {
    setPostalInput(pc);
    setSuggestions([]);
    setShowSuggestions(false);
    if (POSTAL_TO_DISTRICT[pc]) selectDistrict(POSTAL_TO_DISTRICT[pc]);
  }

  const selAqi   = selectedDistrict ? (districtAqis[selectedDistrict] || globalAqi) : null;
  const selLevel = selAqi ? getAQILevel(selAqi) : null;
  const selPostals = selectedDistrict
    ? Object.entries(POSTAL_TO_DISTRICT).filter(([,d]) => d === selectedDistrict).map(([pc]) => pc)
    : [];

  return (
    <div className="card rounded-3xl p-6 fade-in-up" style={{ animationDelay: "0.25s" }}>
      {/* Header */}
      <div className="flex items-center justify-between mb-5">
        <div>
          <h2 className="section-label">BERLIN AIR QUALITY MAP</h2>
          <p style={{ color: "#475569", fontSize: 13, marginTop: 4 }}>Click a district or search by postal code</p>
        </div>
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          <span style={{ background: "#eff6ff", color: "#3b82f6", border: "1px solid #bfdbfe", fontSize: 12, fontWeight: 700, padding: "4px 10px", borderRadius: 20 }}>
            12 Bezirke
          </span>
          <span style={{ background: "#fff7ed", color: "#f97316", border: "1px solid #fed7aa", fontSize: 11, fontWeight: 700, padding: "4px 10px", borderRadius: 20 }}>
            ⚠️ AQI values simulated
          </span>
        </div>
      </div>

      {/* Postal code search */}
      <div style={{ position: "relative", marginBottom: 16 }}>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ position: "relative", flex: 1 }}>
            <svg style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", pointerEvents: "none" }}
              width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" strokeWidth="2.5">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
            <input
              type="text" inputMode="numeric" value={postalInput} maxLength={5}
              placeholder="Search postal code (e.g. 10115, 12043…)"
              onChange={e => handlePostalChange(e.target.value.replace(/\D/g,''))}
              onFocus={() => { if (suggestions.length) setShowSuggestions(true); }}
              onBlur={() => setTimeout(() => setShowSuggestions(false), 150)}
              style={{
                width:"100%", boxSizing:"border-box", padding:"12px 14px 12px 36px",
                background:"#f8fbff", border:"1px solid #bfdbfe", borderRadius:12,
                color:"#1e3a5f", fontSize:14, outline:"none", fontFamily:"Inter,sans-serif",
              }}
              onFocusCapture={e => { e.target.style.borderColor="#2563eb"; e.target.style.boxShadow="0 0 0 3px rgba(37,99,235,0.1)"; }}
              onBlurCapture={e => { e.target.style.borderColor="#bfdbfe"; e.target.style.boxShadow="none"; }}
            />
          </div>
          {selectedDistrict && (
            <button onClick={clearSelection} style={{
              padding:"12px 16px", background:"#eff6ff", border:"1px solid #bfdbfe",
              borderRadius:12, color:"#3b82f6", fontSize:13, fontWeight:600, cursor:"pointer",
              whiteSpace:"nowrap",
            }}>✕ Clear</button>
          )}
        </div>

        {/* Autocomplete dropdown */}
        {showSuggestions && suggestions.length > 0 && (
          <div style={{
            position:"absolute", top:"calc(100% + 4px)", left:0, right:0, zIndex:1000,
            background:"#fff", border:"1px solid #bfdbfe", borderRadius:14,
            boxShadow:"0 8px 32px rgba(37,99,235,0.13)", overflow:"hidden",
          }}>
            {suggestions.map((pc, i) => {
              const d    = POSTAL_TO_DISTRICT[pc];
              const dAqi = districtAqis[d] || globalAqi;
              const lvl  = getAQILevel(dAqi);
              return (
                <div key={pc} onMouseDown={() => pickPostal(pc)} style={{
                  padding:"10px 16px", cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center",
                  borderBottom: i < suggestions.length-1 ? "1px solid #f1f5f9" : "none",
                  background:"#fff",
                }}
                  onMouseOver={e => e.currentTarget.style.background="#f0f7ff"}
                  onMouseOut={e => e.currentTarget.style.background="#fff"}>
                  <div>
                    <span style={{ fontWeight:700, color:"#1e3a5f", fontSize:14 }}>{pc}</span>
                    <span style={{ color:"#64748b", fontSize:13, marginLeft:8 }}>{d}</span>
                  </div>
                  <span style={{ color:lvl.color, fontWeight:700, fontSize:13 }}>AQI {dAqi}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Selected district panel */}
      {selectedDistrict && selLevel && (
        <div className="fade-in-up" style={{
          marginBottom:16, padding:"16px 20px", borderRadius:16,
          background:selLevel.bg, border:`1px solid ${selLevel.color}44`,
        }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:12 }}>
            <div>
              <div style={{ fontWeight:800, fontSize:18, color:"#1e3a5f" }}>{selectedDistrict}</div>
              <div style={{ color:"#64748b", fontSize:13, marginTop:2 }}>{selLevel.sub}</div>
              <div style={{ marginTop:10, display:"flex", flexWrap:"wrap", gap:4 }}>
                {selPostals.map(pc => (
                  <span key={pc} style={{
                    padding:"2px 8px", borderRadius:8, fontSize:11, fontWeight:600,
                    background:"rgba(255,255,255,0.7)", color:"#475569", border:"1px solid rgba(0,0,0,0.08)",
                  }}>{pc}</span>
                ))}
              </div>
            </div>
            <div style={{ textAlign:"right" }}>
              <div style={{ fontWeight:900, fontSize:36, color:selLevel.color, lineHeight:1 }}>{selAqi}</div>
              <div style={{ fontWeight:700, fontSize:13, color:selLevel.text, marginTop:2 }}>{selLevel.label}</div>
              <div style={{ fontSize:11, color:"#94a3b8", marginTop:4 }}>AQI / 500</div>
            </div>
          </div>
        </div>
      )}

      {/* Map */}
      <div style={{ borderRadius:16, overflow:"hidden", border:"1px solid #dbeafe", position:"relative" }}>
        <div ref={mapContainerRef} style={{ height:440, width:"100%" }} />
        {!mapLoaded && !mapError && (
          <div style={{
            position:"absolute", inset:0, display:"flex", flexDirection:"column",
            alignItems:"center", justifyContent:"center", background:"#f0f7ff",
          }}>
            <div style={{ fontSize:32, marginBottom:10 }}>🗺️</div>
            <div style={{ color:"#3b82f6", fontWeight:600, fontSize:14 }}>Loading Berlin map…</div>
            <div style={{ color:"#93c5fd", fontSize:12, marginTop:4 }}>Fetching district boundaries</div>
          </div>
        )}
        {mapError && (
          <div style={{
            position:"absolute", inset:0, display:"flex", flexDirection:"column",
            alignItems:"center", justifyContent:"center", background:"#f0f7ff",
          }}>
            <div style={{ fontSize:32, marginBottom:10 }}>⚠️</div>
            <div style={{ color:"#64748b", fontSize:14, fontWeight:600 }}>Map data unavailable</div>
            <div style={{ color:"#93c5fd", fontSize:12, marginTop:4 }}>Check your internet connection</div>
          </div>
        )}
      </div>

      {/* AQI colour legend */}
      <div style={{ display:"flex", flexWrap:"wrap", gap:"10px 18px", marginTop:14 }}>
        {AQI_LEVELS.map(l => (
          <div key={l.label} style={{ display:"flex", alignItems:"center", gap:6 }}>
            <div style={{ width:12, height:12, borderRadius:3, background:l.color, opacity:0.75 }} />
            <span style={{ color:"#64748b", fontSize:12 }}>{l.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [aqi,          setAqi]          = useState(73);
  const [pollutants,   setPollutants]   = useState(simulatePollutants(73));
  const [forecast,     setForecast]     = useState(generateForecast(73));
  const [profile,      setProfile]      = useState("general");
  const [dataStatus,   setDataStatus]   = useState("connecting"); // "connecting" | "live" | "demo"
  const [stationCount, setStationCount] = useState(0);
  const [realUpdatedAt,setRealUpdatedAt]= useState(null);
  const [showRecs,     setShowRecs]     = useState(true);
  const [location,     setLocation]     = useState("Berlin, Germany");
  const [lastUpdated,  setLastUpdated]  = useState(new Date());
  const [prevAqi,      setPrevAqi]      = useState(73);
  const [trending,     setTrending]     = useState("stable"); // up/down/stable
  const [tick,         setTick]         = useState(0);

  // ── Fetch real data from OpenAQ on mount, then every 5 minutes ──────────
  useEffect(() => {
    function doFetch() {
      setDataStatus("connecting");
      fetchOpenAQ()
        .then(parseOpenAQ)
        .then(parsed => {
          if (!parsed) { setDataStatus("demo"); return; }
          setAqi(parsed.aqi);
          setPollutants({
            pm25: parsed.pm25,
            pm10: parsed.pm10,
            no2:  parsed.no2,
            o3:   parsed.o3,
            co:   parsed.co,
          });
          setStationCount(parsed.stationCount);
          setRealUpdatedAt(parsed.updatedAt);
          setForecast(generateForecast(parsed.aqi));
          setDataStatus("live");
        })
        .catch(() => setDataStatus("demo"));
    }
    doFetch();
    const id = setInterval(doFetch, 5 * 60 * 1000); // refresh every 5 min
    return () => clearInterval(id);
  }, []);

  // Simulate real-time updates every 8 seconds
  useEffect(() => {
    const id = setInterval(() => {
      setAqi(prev => {
        const delta  = (Math.random() - 0.48) * 18;
        const next   = Math.round(Math.max(12, Math.min(320, prev + delta)));
        setPrevAqi(prev);
        setTrending(next > prev + 3 ? "up" : next < prev - 3 ? "down" : "stable");
        setPollutants(simulatePollutants(next));
        setLastUpdated(new Date());
        setTick(t => t + 1);
        return next;
      });
      setForecast(f => {
        // Shift forecast forward
        const updated = f.map((item, i) => {
          if (i === 0) return { ...item, aqi: Math.round(Math.max(12, Math.min(320, item.aqi + (Math.random()-0.5)*10))) };
          return item;
        });
        return updated;
      });
    }, 8000);
    return () => clearInterval(id);
  }, []);

  const level = getAQILevel(aqi);
  const recs  = getProfileRecs(profile, aqi);
  const maxForecast = Math.max(...forecast.map(f => f.aqi), 50);
  const now   = new Date();
  const timeStr = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  // Find primary pollutant
  const primaryPollutant = "PM₂.₅";

  return (
    <div className="min-h-screen p-4 md:p-8" style={{ background: "linear-gradient(160deg, #eff6ff 0%, #dbeafe 40%, #ede9fe 100%)" }}>
      {/* Ambient glow */}
      <div className="fixed inset-0 pointer-events-none overflow-hidden">
        <div className="absolute rounded-full" style={{
          width: 700, height: 700, top: -250, left: "50%", transform: "translateX(-50%)",
          background: `radial-gradient(circle, ${level.glow} 0%, transparent 70%)`,
          transition: "background 1.5s ease"
        }} />
      </div>

      <div className="relative max-w-4xl mx-auto space-y-4">

        {/* ── HEADER ──────────────────────────────────────────────────────── */}
        <div className="flex items-center justify-between">
          <div>
            <div className="flex items-center gap-2">
              <div className="w-2 h-2 rounded-full pulse-ring" style={{
                background: dataStatus === "live" ? "#16a34a" : dataStatus === "connecting" ? "#f59e0b" : "#f97316"
              }} />
              <span className="text-xs font-semibold" style={{
                color: dataStatus === "live" ? "#16a34a" : dataStatus === "connecting" ? "#f59e0b" : "#f97316",
                letterSpacing: "0.08em"
              }}>
                {dataStatus === "live" ? "LIVE DATA" : dataStatus === "connecting" ? "CONNECTING…" : "DEMO DATA"}
              </span>
              {dataStatus === "live" && stationCount > 0 && (
                <span className="text-xs" style={{ color: "#93c5fd" }}>· {stationCount} Berlin stations</span>
              )}
            </div>
            <h1 className="text-2xl font-black gradient-text mt-1">AirWatch</h1>
          </div>
          <div className="text-right">
            <div className="flex items-center gap-1 justify-end">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" strokeWidth="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
              </svg>
              <span className="text-sm font-medium" style={{ color: "#1e40af" }}>{location}</span>
            </div>
            <span className="text-xs" style={{ color: "#93c5fd" }}>
              {dataStatus === "live" && realUpdatedAt
                ? "Station data: " + realUpdatedAt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
                : dataStatus === "demo"
                ? "⚠️ Showing simulated data"
                : "Connecting to OpenAQ…"}
            </span>
            <span className="text-xs" style={{ color: "#bfdbfe", marginTop: 3, display: "block" }}>
              <span style={{ color: "#cbd5e1" }}>Sources: </span>
              <a href="https://openaq.org" target="_blank" rel="noopener" style={{ color: "#3b82f6", textDecoration: "none", fontWeight: 600 }}>OpenAQ</a>
              <span style={{ color: "#cbd5e1" }}> · </span>
              <a href="https://www.eea.europa.eu/themes/air" target="_blank" rel="noopener" style={{ color: "#3b82f6", textDecoration: "none", fontWeight: 600 }}>EU EEA</a>
              <span style={{ color: "#cbd5e1" }}> · </span>
              <a href="https://www.umweltbundesamt.de" target="_blank" rel="noopener" style={{ color: "#3b82f6", textDecoration: "none", fontWeight: 600 }}>UBA</a>
            </span>
          </div>
        </div>

        {/* ── HERO CARD ────────────────────────────────────────────────────── */}
        <div className="card rounded-3xl p-6 md:p-8 fade-in-up" style={{ border: `1px solid ${level.color}44` }}>
          <div className="flex flex-col md:flex-row items-center gap-8">

            {/* Gauge */}
            <div className="flex-shrink-0 float">
              <AQIGauge aqi={aqi} level={level} />
            </div>

            {/* Status */}
            <div className="flex-1 space-y-4 text-center md:text-left">
              <div>
                <div className="flex items-center gap-3 justify-center md:justify-start flex-wrap">
                  <span className="text-4xl font-black" style={{ color: level.color, textShadow: `0 0 40px ${level.glow}`, transition: "color 0.8s ease" }}>
                    {level.label}
                  </span>
                  {/* Trend indicator */}
                  <div className="flex items-center gap-1 px-2 py-1 rounded-full" style={{ background: "#eff6ff" }}>
                    <span style={{ fontSize: 12, color: trending === "up" ? "#ef4444" : trending === "down" ? "#16a34a" : "#94a3b8" }}>
                      {trending === "up" ? "↑" : trending === "down" ? "↓" : "→"}
                    </span>
                    <span className="text-xs" style={{ color: "#64748b" }}>
                      {trending === "up" ? "Rising" : trending === "down" ? "Improving" : "Stable"}
                    </span>
                  </div>
                </div>
                <p className="text-lg mt-1" style={{ color: "#64748b" }}>{level.sub}</p>
              </div>

              {/* Context chips */}
              <div className="flex flex-wrap gap-2 justify-center md:justify-start">
                <div className="px-3 py-1.5 rounded-full text-xs font-semibold" style={{ background: level.bg, color: level.text, border: `1px solid ${level.color}33` }}>
                  Primary: {primaryPollutant}
                </div>
                <div className="px-3 py-1.5 rounded-full text-xs font-semibold" style={{ background: "#eff6ff", color: "#3b82f6", border: "1px solid #bfdbfe" }}>
                  AQI {aqi} / 500
                </div>
                <div className="px-3 py-1.5 rounded-full text-xs font-semibold" style={{ background: "#eff6ff", color: "#3b82f6", border: "1px solid #bfdbfe" }}>
                  {new Date().toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })}
                </div>
              </div>

              {/* Plain-language context */}
              <div className="p-4 rounded-2xl" style={{ background: level.bg, border: `1px solid ${level.color}22` }}>
                <p className="text-sm font-medium" style={{ color: level.text }}>
                  {aqi <= 50  && "✅ The air is clean and fresh. No restrictions apply — breathe easy and enjoy the outdoors."}
                  {aqi > 50  && aqi <= 100 && "🟡 Air quality is acceptable. Most people can go about their day normally."}
                  {aqi > 100 && aqi <= 150 && "🟠 Air quality is poor for sensitive groups. If you have asthma or heart disease, reduce outdoor time."}
                  {aqi > 150 && aqi <= 200 && "🔴 Unhealthy air — everyone may start to feel effects. Limit outdoor time and avoid heavy exertion."}
                  {aqi > 200 && aqi <= 300 && "🟣 Very unhealthy — health warnings in effect for everyone. Stay indoors and run your air purifier."}
                  {aqi > 300 && "🚨 Hazardous — emergency conditions. Do not go outside. Seal windows and doors."}
                </p>
              </div>
            </div>
          </div>
        </div>

        {/* ── POLLUTANT BREAKDOWN ──────────────────────────────────────────── */}
        <div className="card rounded-3xl p-6 fade-in-up" style={{ animationDelay: "0.1s" }}>
          <h2 className="section-label mb-4">POLLUTANT BREAKDOWN</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {POLLUTANTS.map(p => (
              <PollutantBar key={p.id} p={p} value={pollutants[p.id]} level={level} />
            ))}
          </div>
          <p className="text-xs mt-4" style={{ color: "#93c5fd" }}>
            Vertical line indicates WHO safe threshold. Values update every 8 seconds.
          </p>
        </div>

        {/* ── FORECAST ────────────────────────────────────────────────────── */}
        <div className="card rounded-3xl p-6 fade-in-up" style={{ animationDelay: "0.2s" }}>
          <div className="flex items-center justify-between mb-6">
            <h2 className="section-label">6-HOUR FORECAST</h2>
            <span className="text-xs px-2 py-1 rounded-full" style={{
              background: "#fff7ed", color: "#f97316", border: "1px solid #fed7aa", fontWeight: 600,
            }}>⚠️ Forecast simulated</span>
          </div>
          <div className="flex gap-2 items-end">
            {forecast.map((item, i) => (
              <ForecastBar key={i} item={item} maxAqi={maxForecast} index={i} />
            ))}
          </div>
          {/* AQI legend */}
          <div className="flex flex-wrap gap-3 mt-4">
            {AQI_LEVELS.map(l => (
              <div key={l.label} className="flex items-center gap-1.5">
                <div className="w-2 h-2 rounded-full" style={{ background: l.color }} />
                <span className="text-xs" style={{ color: "#64748b" }}>{l.label}</span>
              </div>
            ))}
          </div>
        </div>

        {/* ── HISTORY CHART ────────────────────────────────────────────────── */}
        <HistoryChart globalAqi={aqi} dataStatus={dataStatus} />

        {/* ── BERLIN MAP ───────────────────────────────────────────────────── */}
        <BerlinMap globalAqi={aqi} dataStatus={dataStatus} />

        {/* ── PERSONALISED RECOMMENDATIONS ────────────────────────────────── */}
        <div className="card rounded-3xl p-6 fade-in-up" style={{ animationDelay: "0.3s" }}>
          <div className="flex items-center justify-between mb-4">
            <h2 className="section-label">PERSONALISED ADVICE</h2>
            <Toggle on={showRecs} onChange={setShowRecs} label="Show recommendations" />
          </div>

          {/* Profile selector */}
          <div className="flex flex-wrap gap-2 mb-4">
            {PROFILES.map(p => (
              <button
                key={p.id}
                onClick={() => setProfile(p.id)}
                className={`profile-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold ${profile === p.id ? "active" : ""}`}
                style={{
                  background: profile === p.id ? level.bg : "#f1f5f9",
                  border:     profile === p.id ? `1px solid ${level.color}66` : "1px solid #e2e8f0",
                  color:      profile === p.id ? level.text : "#64748b",
                }}
              >
                <span>{p.icon}</span>
                <div className="text-left">
                  <div>{p.label}</div>
                </div>
              </button>
            ))}
          </div>

          {/* Selected profile description */}
          <div className="text-xs mb-4" style={{ color: "#94a3b8" }}>
            Showing advice for: <span style={{ color: "#1e40af", fontWeight: 600 }}>
              {PROFILES.find(p => p.id === profile)?.desc}
            </span>
          </div>

          {/* Recommendations */}
          {showRecs && (
            <div className="space-y-2">
              {recs.map((rec, i) => (
                <div key={i} className="flex items-start gap-3 p-3 rounded-xl fade-in-up card-hover"
                  style={{ background: "#f8fbff", border: "1px solid #dbeafe", animationDelay: `${i * 0.06}s` }}>
                  <span className="text-sm leading-snug" style={{ color: "#1e3a5f" }}>{rec}</span>
                </div>
              ))}
            </div>
          )}
          {!showRecs && (
            <div className="text-center py-6 text-sm" style={{ color: "#93c5fd" }}>
              Toggle recommendations on to see personalised advice
            </div>
          )}
        </div>

        {/* ── AQI SCALE REFERENCE ──────────────────────────────────────────── */}
        <div className="card rounded-3xl p-6 fade-in-up" style={{ animationDelay: "0.4s" }}>
          <h2 className="section-label mb-4">AQI SCALE REFERENCE</h2>
          <div className="space-y-2">
            {AQI_LEVELS.map((l, i) => {
              const prev = i === 0 ? 0 : AQI_LEVELS[i-1].max + 1;
              const isActive = aqi <= l.max && (i === 0 || aqi > AQI_LEVELS[i-1].max);
              return (
                <div key={l.label} className="flex items-center gap-3 p-2 rounded-xl" style={{
                  background: isActive ? l.bg : "transparent",
                  border: isActive ? `1px solid ${l.color}55` : "1px solid transparent",
                  transition: "all 0.5s ease"
                }}>
                  <div className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: l.color, boxShadow: isActive ? `0 0 8px ${l.color}` : "none" }} />
                  <div className="flex-1 flex items-center justify-between">
                    <span className="text-sm font-semibold" style={{ color: isActive ? l.text : "#64748b" }}>{l.label}</span>
                    <span className="text-xs" style={{ color: "#94a3b8" }}>{prev}–{l.max}</span>
                  </div>
                  {isActive && <span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{ background: l.color, color: "#fff" }}>NOW</span>}
                </div>
              );
            })}
          </div>
        </div>

        {/* Footer */}
        <div className="text-center py-4">
          <p className="text-xs" style={{ color: "#93c5fd" }}>
            {dataStatus === "live"
              ? `AirWatch · Live data via OpenAQ · ${stationCount} Berlin stations · Forecast & history simulated`
              : "AirWatch · Demo mode — live data unavailable · All values simulated"}
          </p>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
